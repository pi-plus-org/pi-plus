name: Publish pi-plus packages

# Publishes pi-plus (packages/plus-cli) and pi-plus-sdk (packages/plus-api) to
# npmjs on every push to main, mirroring .claude/scripts/pipi-publish.sh and
# pipi-sdk-publish.sh: auto patch-bump from the package.json version, build
# offline, sanity-check the tarball, publish under the resolved dist-tag
# ("latest", or a per-line "v<major>-<minor>" tag such as "v0-1" when the
# version is at/below the registry's latest), then commit the bump immediately
# after the second publish is accepted by the registry.
#
# Version availability on npmjs is polled for up to 10 minutes after each
# publish; the result (available, or stuck) is pushed to ntfy. Set the
# NTFY_TOPIC repository secret to the ntfy topic to notify, e.g. the topic id
# for https://ntfy.sh/<topic>. Unset means notifications are skipped.
#
# Uses npm Trusted Publishing (OIDC): no npm token is stored in GitHub. The
# pi-plus and pi-plus-sdk packages on npmjs trust this repo's publish-plus.yml
# workflow running in the "npm-publish" environment.

on:
  push:
    branches: [main]

concurrency:
  group: publish-plus
  # Never cancel a run mid-publish — an interrupted publish could leave the
  # registry ahead of the repo without the bump commit landing.
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  publish:
    # The version-bump commit this workflow pushes starts with this prefix;
    # without the guard, every publish would trigger another push and loop forever.
    if: "${{ !startsWith(github.event.head_commit.message, 'feat(plus): release pi-plus') }}"
    environment: npm-publish # must match the environment named in the npmjs trusted publisher config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Shared helpers for both publish steps, written to $RUNNER_TEMP so they
      # never land in the repo or a tarball. NTFY_TOPIC is passed via step env;
      # an empty topic makes the notification a no-op. Best effort only: a
      # notification failure never fails a publish.
      - name: Write notification helpers
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/notify.sh" <<'EOF'
          #!/usr/bin/env bash
          # Usage: notify.sh <title> <message>
          set -uo pipefail
          title="${1:-pi-plus}"
          message="${2:-}"
          topic="${NTFY_TOPIC:-}"
          if [[ -z "$topic" ]]; then
            echo "ntfy: NTFY_TOPIC is not set, skipping notification"
            exit 0
          fi
          curl --silent --show-error --fail \
            -H "Title: ${title}" \
            -H "Priority: high" \
            -d "${message}" \
            "https://ntfy.sh/${topic}" || \
            echo "warning: ntfy notification '${title}' failed" >&2
          exit 0
          EOF

          cat > "$RUNNER_TEMP/wait-npm.sh" <<'EOF'
          #!/usr/bin/env bash
          # Usage: wait-npm.sh <package> <version>
          # A freshly published version can take a while before it resolves
          # through the registry API, so poll for up to 10 minutes.
          set -uo pipefail
          name="$1"
          version="$2"
          deadline=$((SECONDS + 600))
          while true; do
            if npm view "${name}@${version}" version --registry https://registry.npmjs.org --prefer-online >/dev/null 2>&1; then
              echo "${name}@${version} is available on npmjs"
              "$RUNNER_TEMP/notify.sh" "${name} published" "${name}@${version} is available on npmjs"
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::${name}@${version} still not on npmjs after 600s — publish succeeded but propagation looks stuck; check https://www.npmjs.com/package/${name}/v/${version}" >&2
              "$RUNNER_TEMP/notify.sh" "${name} propagation stuck" "${name}@${version} published but still not resolvable on npmjs after 600s: https://www.npmjs.com/package/${name}/v/${version}"
              exit 1
            fi
            echo "Waiting for ${name}@${version} to appear on npmjs..."
            sleep 5
          done
          EOF

          chmod +x "$RUNNER_TEMP/notify.sh" "$RUNNER_TEMP/wait-npm.sh"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs npm >= 11.5 (node 22 ships npm 10).
      - name: Upgrade npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Version = patch bump of the package.json version (the registry never
      # changes the version). Tag = "latest" when that version is above the
      # registry's latest, otherwise a per-line tag "v<major>-<minor>"
      # ("v0-1"; dots would make it a valid semver range, which npm forbids as
      # a tag), under which the version must be installed explicitly
      # (npm install pi-plus@v0-1) until a higher line takes over latest.
      - name: Resolve and bump versions
        id: versions
        run: |
          set -euo pipefail
          bump() {
            local pkg_json="$1" registry_name="$2" out_prefix="$3"
            local local_version latest_version next_version tag
            local_version="$(node -p "require('./$pkg_json').version")"
            latest_version="$(npm view "$registry_name" version 2>/dev/null || echo "0.0.0")"
            read -r next_version tag <<<"$(node -e '
          const semver = require("semver");
          const next = semver.inc(process.argv[1], "patch");
          if (semver.gt(next, process.argv[2])) {
            console.log(`${next} latest`);
          } else {
            console.log(`${next} v${semver.major(next)}-${semver.minor(next)}`);
          }
          ' "$local_version" "$latest_version")"
            echo "Version: $registry_name $local_version (package.json) -> $next_version, tag: $tag (registry latest: $latest_version)"
            if [[ "$tag" != "latest" ]]; then
              echo "::warning::$registry_name@$next_version is at or below the registry's latest $latest_version and cannot take over the 'latest' tag; publishing under dist-tag '$tag' (npm install $registry_name@$tag)" >&2
            fi
            node -e '
          const fs = require("fs");
          const path = process.argv[1];
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.version = process.argv[2];
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, "\t")}\n`);
          ' "$pkg_json" "$next_version"
            echo "${out_prefix}_bumped=true" >> "$GITHUB_OUTPUT"
            echo "${out_prefix}_next=$next_version" >> "$GITHUB_OUTPUT"
            echo "${out_prefix}_tag=$tag" >> "$GITHUB_OUTPUT"
          }
          bump packages/plus-cli/package.json pi-plus cli
          bump packages/plus-api/package.json pi-plus-sdk sdk
          npm install --package-lock-only --ignore-scripts >/dev/null

      # Shared by both publish scripts (identical commands); run once instead
      # of twice. meta.json is generated (gitignored), so hydrate it before
      # build:offline's staleness check.
      - name: Build
        run: |
          npm run hydrate:model-data
          npm run build:offline

      - name: Publish pi-plus (CLI)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          node packages/plus-cli/build.mjs

          # Sanity-check the tarball contents.
          pack_json="$(cd packages/plus-cli/dist/npm && npm pack --dry-run --json --ignore-scripts)"
          node -e '
          const files = JSON.parse(process.argv[1])[0].files.map((f) => f.path);
          const required = ["pipi.js", "package.json", "modes/interactive/theme/dark.json", "core/export-html/template.html"];
          const missing = required.filter((f) => !files.includes(f));
          if (missing.length > 0) {
            console.error(`error: missing from the pack tarball: ${missing.join(", ")}`);
            process.exit(1);
          }
          const forbidden = files.filter((f) => f.startsWith("dist/") || f.startsWith("src/") || f.startsWith("loader/"));
          if (forbidden.length > 0) {
            console.error(`error: unexpected entries in the pack tarball: ${forbidden.join(", ")}`);
            process.exit(1);
          }
          console.log(`tarball OK: ${files.length} files`);
          ' "$pack_json"

          (cd packages/plus-cli/dist/npm && npm publish --access public --ignore-scripts --tag "${{ steps.versions.outputs.cli_tag }}")

          "$RUNNER_TEMP/wait-npm.sh" pi-plus "${{ steps.versions.outputs.cli_next }}"

      - name: Publish pi-plus-sdk
        run: |
          set -euo pipefail
          node packages/plus-api/build.mjs

          # Sanity-check the tarball contents.
          pack_json="$(cd packages/plus-api/dist/npm && npm pack --dry-run --json --ignore-scripts)"
          node -e '
          const files = JSON.parse(process.argv[1])[0].files.map((f) => f.path);
          const required = ["api.js", "api.d.ts", "package.json", "modes/interactive/theme/dark.json", "core/export-html/template.html"];
          const missing = required.filter((f) => !files.includes(f));
          if (missing.length > 0) {
            console.error(`error: missing from the pack tarball: ${missing.join(", ")}`);
            process.exit(1);
          }
          const forbidden = files.filter((f) => f.startsWith("dist/") || f.startsWith("src/") || f.startsWith("build/"));
          if (forbidden.length > 0) {
            console.error(`error: unexpected entries in the pack tarball: ${forbidden.join(", ")}`);
            process.exit(1);
          }
          console.log(`tarball OK: ${files.length} files`);
          ' "$pack_json"

          # The staged types dependency (api.d.ts re-exports the upstream SDK)
          # is an exact pin to the workspace coding-agent version; consumers
          # resolve it from the registry, so it must already be published.
          types_pin="$(cd packages/plus-api/dist/npm && node -p "require(\"./package.json\").dependencies[\"@earendil-works/pi-coding-agent\"]")"
          if ! npm view "@earendil-works/pi-coding-agent@$types_pin" version >/dev/null 2>&1; then
            echo "error: staged types dependency @earendil-works/pi-coding-agent@$types_pin is not on the registry yet." >&2
            echo "Publish that upstream version first (or sync the workspace to a released one)." >&2
            exit 1
          fi
          echo "Types dependency @earendil-works/pi-coding-agent@$types_pin is on the registry"

          (cd packages/plus-api/dist/npm && npm publish --access public --ignore-scripts --tag "${{ steps.versions.outputs.sdk_tag }}")

      # Commit right after the second publish, before waiting for propagation:
      # once the registry accepted both versions, the bump must land even if
      # propagation stalls. Otherwise the repo stays behind the published
      # versions and every later run re-bumps (and re-publishes) them.
      - name: Commit version bumps
        if: ${{ steps.versions.outputs.cli_bumped == 'true' || steps.versions.outputs.sdk_bumped == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add packages/plus-cli/package.json packages/plus-api/package.json package-lock.json
          # PI_ALLOW_LOCKFILE_CHANGE is required by the repo's pre-commit hook
          # for lockfile commits (no-op in CI, where hooks are not installed).
          PI_ALLOW_LOCKFILE_CHANGE=1 git commit -m "feat(plus): release pi-plus v${{ steps.versions.outputs.cli_next }}, pi-plus-sdk v${{ steps.versions.outputs.sdk_next }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Wait for pi-plus-sdk on npmjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wait-npm.sh" pi-plus-sdk "${{ steps.versions.outputs.sdk_next }}"

      # Publish/propagation failures are otherwise silent (a failure before the
      # bump commit leaves the registry ahead of the repo, and nobody is told).
      - name: Notify failure
        if: ${{ failure() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          if [[ -x "$RUNNER_TEMP/notify.sh" ]]; then
            "$RUNNER_TEMP/notify.sh" "pi-plus publish failed" \
              "${{ github.repository }}@${{ github.ref_name }} run ${{ github.run_id }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
